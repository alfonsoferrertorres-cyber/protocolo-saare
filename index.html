<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS3V S.A.A.R.E. | Layer 7 Deterministic Perimeter Infrastructure</title>
    <!-- Favicon Real -->
    <link rel="icon" type="image/png" href="Logo + Cumplimiento.png">
    <style>
        :root {
            --primary-bg: #090d16;
            --surface-bg: #111827;
            --surface-card: #1f2937;
            --accent-cyan: #00d4b2;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #374151;
            --success-green: #10b981;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-main);
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-img {
            height: 42px;
            width: auto;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .logo-text {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--text-main);
            background: linear-gradient(to right, #ffffff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .shield-status {
            background: rgba(0, 212, 178, 0.1);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 212, 178, 0.3);
            padding: 6px 14px;
            font-family: monospace;
            font-size: 11px;
            font-weight: bold;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }

        .hero {
            text-align: center;
            padding: 80px 0 50px 0;
            max-width: 900px;
            margin: 0 auto;
        }

        .tag-top {
            color: var(--accent-blue);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 44px;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
            background: linear-gradient(to bottom right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 18px;
            color: var(--text-muted);
            margin-bottom: 40px;
            max-width: 750px;
            margin-left: auto;
            margin-right: auto;
        }

        .pricing-grid {
            display: flex;
            justify-content: center;
            margin: 20px 0 60px 0;
        }

        .card {
            background: var(--surface-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 45px;
            max-width: 650px;
            width: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .card::before {
            content: "CERTIFICACIÓN DE PROTOCOLO ACTIVADA";
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan));
            color: #090d16;
            font-size: 10px;
            font-weight: 800;
            padding: 5px 16px;
            border-radius: 20px;
            letter-spacing: 1px;
        }

        .card-title {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 4px;
            text-align: center;
        }

        .card-allocation {
            font-family: monospace;
            font-size: 12px;
            color: var(--accent-cyan);
            margin-bottom: 30px;
            text-align: center;
            opacity: 0.9;
        }

        .card-price {
            font-size: 42px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 30px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 25px;
        }

        .card-price span {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 400;
            display: block;
            margin-top: 5px;
        }

        .features-list {
            list-style: none;
            padding: 0;
            margin: 0 0 40px 0;
            flex-grow: 1;
        }

        .features-list li {
            font-size: 15px;
            margin-bottom: 16px;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .features-list li::before {
            content: "✓";
            color: var(--accent-cyan);
            font-weight: bold;
            font-size: 16px;
        }

        .btn-action {
            display: block;
            text-align: center;
            background: linear-gradient(90deg, var(--accent-cyan), #00bfa4);
            color: #090d16;
            text-decoration: none;
            font-weight: 700;
            padding: 18px;
            border-radius: 8px;
            font-size: 16px;
            letter-spacing: 0.5px;
            transition: opacity 0.2s, transform 0.2s;
            box-shadow: 0 4px 20px rgba(0, 212, 178, 0.2);
        }

        .btn-action:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .section-title {
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            margin: 80px 0 40px 0;
            letter-spacing: -0.5px;
        }

        .tech-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .tech-box {
            background: var(--surface-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 8px;
            transition: border-color 0.2s;
        }

        .tech-box:hover {
            border-color: var(--accent-blue);
        }

        .tech-box h3 {
            color: #ffffff;
            margin-top: 0;
            font-size: 17px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tech-box h3::after {
            content: "PROCTED";
            font-family: monospace;
            font-size: 9px;
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent-blue);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .tech-box p {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .doc-link {
            display: block;
            font-family: monospace;
            font-size: 11px;
            color: var(--accent-cyan);
            background: rgba(0, 212, 178, 0.05);
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px dashed rgba(0, 212, 178, 0.2);
        }

        .crypto-vault {
            background: #0f141c;
            border: 1px dashed var(--border-color);
            padding: 30px;
            border-radius: 8px;
            margin: 60px 0;
            font-family: monospace;
        }

        .crypto-vault-header {
            color: var(--accent-blue);
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }

        .crypto-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
            font-size: 12px;
        }

        .crypto-item {
            background: var(--surface-bg);
            padding: 12px 16px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .crypto-item span {
            color: var(--text-muted);
            display: block;
            margin-bottom: 4px;
            font-size: 11px;
        }

        .crypto-item strong {
            color: #e2e8f0;
            word-break: break-all;
        }

        .legal-downloads {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin: 40px 0 80px 0;
        }

        .btn-doc {
            background: var(--surface-bg);
            border: 1px solid var(--border-color);
            color: #e2e8f0;
            padding: 14px 20px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-doc:hover {
            border-color: var(--accent-cyan);
            background: #1f2937;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
